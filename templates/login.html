{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="card login-card">
  <h2>Login</h2>
  <form method="POST">
    <label>Role</label>
    <select name="role" required>
      <option value="student">Student</option>
      <option value="faculty">Faculty</option>
    </select>

    <label>Username</label>
    <input type="text" name="username" placeholder="e.g. student1" required>

    <label>Password</label>
    <input type="password" name="password" placeholder="pass123" required>

    <button type="submit" class="btn btn-primary">Login</button>
  </form>
  <div class="demo-box">
    <strong>Demo accounts</strong>
    <p>Faculty: <code>Bhagyashree</code> / <code>pass123</code></p>
    <p>Yash Swain: <code>Yash</code> / <code>pass123</code></p>
    <p>Rajdatt Sawant: <code>Rajdatt</code> / <code>pass123</code></p>
  </div>
</div>
{% endblock %}
